<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="splashBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0E141D"/>
      <stop offset="60%" stop-color="#07090E"/>
      <stop offset="100%" stop-color="#030406"/>
    </radialGradient>
    <linearGradient id="splashNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="45%" stop-color="#10FFA0"/>
      <stop offset="80%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#05DF72"/>
    </linearGradient>
    <filter id="splashGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#splashBg)"/>

  <!-- Centered Kinetic Monogram -->
  <g transform="translate(256, 180) scale(1.0)" filter="url(#splashGlow)">
