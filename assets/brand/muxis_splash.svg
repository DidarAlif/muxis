    <path d="M 394 128 C 394 106, 424 106, 424 128 L 424 384 C 424 406, 394 406, 394 384 Z" fill="url(#splashNeonGrad)"/>
    <path d="M 148 190 C 148 168, 172 156, 190 170 L 244 214 C 251 220, 261 220, 268 214 L 322 170 C 340 156, 364 168, 364 190 L 364 260 C 364 274, 356 288, 344 296 L 270 348 C 261 354, 251 354, 242 348 L 168 296 C 156 288, 148 274, 148 260 Z" fill="url(#splashNeonGrad)"/>
    <circle cx="256" cy="154" r="14" fill="#00FF88"/>
    <circle cx="256" cy="154" r="6" fill="#FFFFFF"/>
    <rect x="236" y="376" width="40" height="12" rx="6" fill="#00FF88"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="512" y="730" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="56" font-weight="900" letter-spacing="12" fill="#FFFFFF" text-anchor="middle">MUXIS</text>
  <text x="512" y="775" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" letter-spacing="6" fill="#00FF88" text-anchor="middle">PRISMATIC AURA</text>
