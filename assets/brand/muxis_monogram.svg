<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Vibrant Neon Green Prismatic Aura Gradient -->
    <linearGradient id="neonGreenMuxis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="45%" stop-color="#10FFA0"/>
      <stop offset="80%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#05DF72"/>
    </linearGradient>

    <!-- Deep Ambient Glow Filter -->
    <filter id="neonAuraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="ambientOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#10FFA0" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient audio energy aura -->
  <circle cx="256" cy="256" r="220" fill="url(#ambientOrb)"/>

  <!-- Iconic Kinetic Soundwave M Monogram -->
  <g filter="url(#neonAuraGlow)">
    <!-- Left Outer Harmonic Beam -->
    <path d="M 88 128
             C 88 106, 118 106, 118 128
             L 118 384
             C 118 406, 88 406, 88 384
             Z"
          fill="url(#neonGreenMuxis)"/>

    <!-- Right Outer Harmonic Beam -->
    <path d="M 394 128
             C 394 106, 424 106, 424 128
             L 424 384
             C 424 406, 394 406, 394 384
             Z"
          fill="url(#neonGreenMuxis)"/>

    <!-- Continuous Central Acoustic Crest (Fluid Aerodynamic 'M') -->
    <path d="M 148 190
             C 148 168, 172 156, 190 170
             L 244 214
             C 251 220, 261 220, 268 214
             L 322 170
             C 340 156, 364 168, 364 190
             L 364 260
             C 364 274, 356 288, 344 296
             L 270 348
             C 261 354, 251 354, 242 348
             L 168 296
             C 156 288, 148 274, 148 260
             Z"
          fill="url(#neonGreenMuxis)"/>

    <!-- Dynamic Central Core Frequency Node -->
    <circle cx="256" cy="154" r="14" fill="#00FF88"/>
    <circle cx="256" cy="154" r="6" fill="#FFFFFF"/>

    <!-- Sub-Bass Pulse Anchor Bar -->
    <rect x="236" y="376" width="40" height="12" rx="6" fill="#00FF88"/>
  </g>
</svg>
