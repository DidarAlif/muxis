<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111520"/>
      <stop offset="60%" stop-color="#090B10"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#4FACFE" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#7F00FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E100FF" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="35%" stop-color="#4FACFE"/>
      <stop offset="70%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#E100FF"/>
    </linearGradient>
    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7F00FF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090B10" stop-opacity="0"/>
    </radialGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" filter="url(#iconShadow)"/>

  <!-- Ambient light pool inside icon -->
  <circle cx="256" cy="240" r="180" fill="url(#centerAura)"/>

  <!-- Muxis Monogram Mark -->
  <g filter="url(#coreGlow)">
    <!-- Left frequency pillar -->
    <rect x="108" y="136" width="44" height="240" rx="22" fill="url(#mGrad)"/>

    <!-- Dynamic M chevron -->
    <path d="M 180 186
             C 180 174, 196 166, 206 174
             L 246 206
             C 252 211, 260 211, 266 206
             L 306 174
             C 316 166, 332 174, 332 186
             L 332 232
             C 332 239, 328 246, 322 251
             L 268 296
             C 261 302, 251 302, 244 296
             L 190 251
             C 184 246, 180 239, 180 232
             Z"
          fill="url(#mGrad)"/>

    <!-- Right frequency pillar -->
    <rect x="360" y="136" width="44" height="240" rx="22" fill="url(#mGrad)"/>

    <!-- Baseline pulse notch -->
    <rect x="236" y="328" width="40" height="48" rx="20" fill="url(#mGrad)"/>
    
    <!-- Optical apex spark -->
    <circle cx="256" cy="154" r="10" fill="#00F2FE"/>
    <circle cx="256" cy="154" r="4" fill="#FFFFFF"/>
  </g>
</svg>
