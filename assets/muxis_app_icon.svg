<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="iconCrystalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1C28"/>
      <stop offset="50%" stop-color="#070D17"/>
      <stop offset="100%" stop-color="#110A22"/>
    </linearGradient>
    <linearGradient id="iconGlassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#9D6BFF" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="iconDomeSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="48%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="iconPrismWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="48%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#9D6BFF"/>
    </linearGradient>
    <radialGradient id="iconGlowPool" cx="50%" cy="44%" r="48%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#00FF88" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#070D17" stop-opacity="0"/>
    </radialGradient>
    <filter id="iconOuterShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="iconInnerGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#iconCrystalBg)" stroke="url(#iconGlassRim)" stroke-width="5" filter="url(#iconOuterShadow)"/>
  <ellipse cx="256" cy="220" rx="188" ry="165" fill="url(#iconGlowPool)"/>
  <rect x="30" y="30" width="452" height="220" rx="110" fill="url(#iconDomeSheen)"/>

  <g transform="translate(66, 26) scale(0.74)" filter="url(#iconInnerGlow)">

    <!-- Outer harmonic water-wave resonance arcs -->
    <path d="M 74 218 C 52 240, 52 278, 74 302" fill="none" stroke="url(#iconPrismWave)" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
    <path d="M 438 218 C 460 240, 460 278, 438 302" fill="none" stroke="url(#iconPrismWave)" stroke-width="14" stroke-linecap="round" opacity="0.55"/>

    <!-- Continuous Liquid-Wave 'M' Acoustic Crest Ribbon -->
    <path d="M 106 362
             L 106 184
             C 106 142, 152 126, 184 156
             L 242 214
             C 250 222, 262 222, 270 214
             L 328 156
             C 360 126, 406 142, 406 184
             L 406 362
             C 406 382, 370 382, 370 362
             L 370 198
             C 370 180, 352 174, 340 186
             L 278 248
             C 265 261, 247 261, 234 248
             L 172 186
             C 160 174, 142 180, 142 198
             L 142 362
             C 142 382, 106 382, 106 362
             Z"
          fill="url(#iconPrismWave)"/>

    <!-- Sculpted Inner Wave Bridge (turns negative space into an unmistakable sonic wave + M crest) -->
    <path d="M 178 292
             Q 216 266, 256 300
             Q 296 334, 334 292"
          fill="none" stroke="url(#iconPrismWave)" stroke-width="22" stroke-linecap="round" opacity="0.95"/>

    <!-- Floating Liquid Prism Droplet Orb above the 'M' crest -->
    <path d="M 256 102
             C 272 122, 280 136, 280 148
             C 280 162, 269 173, 256 173
             C 243 173, 232 162, 232 148
             C 232 136, 240 122, 256 102
             Z"
          fill="url(#iconPrismWave)"/>
    <circle cx="250" cy="146" r="6" fill="#FFFFFF" opacity="0.92"/>

  </g>

  <text x="256" y="428" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="14" fill="#F8FAFC" text-anchor="middle">MUXIS</text>
</svg>
