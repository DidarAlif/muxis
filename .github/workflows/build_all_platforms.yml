name: Cross-Platform Matrix Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/build_all_platforms.yml'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 Desktop
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows Scaffolding
        run: flutter create --platforms=windows --org app.muxis .

      - name: Inject MUXIS Prismatic Aura Icon
        shell: pwsh
        run: |
          Copy-Item assets/brand/app_icon.ico windows/runner/resources/app_icon.ico -Force

      - name: Configure VS Version for CMake
        shell: pwsh
        run: |
          echo "CMAKE_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Package Windows Release ZIP & Installer
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Muxis-Windows-x64.zip -Force
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          & $iscc "/DOutputBaseName=Muxis-Windows-x64-Setup" "installer\windows\muxis_setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muxis-Windows-x64
          path: |
            Muxis-Windows-x64-Setup.exe
            Muxis-Windows-x64.zip
          retention-days: 14

  build-macos:
    name: Build macOS Desktop
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Generate macOS Scaffolding
        run: flutter create --platforms=macos --org app.muxis .

      - name: Inject macOS Brand Icons
        run: cp -f assets/brand/icons/macos/*.png macos/Runner/Assets.xcassets/AppIcon.appiconset/

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS App
        run: flutter build macos --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Package macOS App
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../Muxis-macOS-Universal.zip muxis.app || zip -r -y ../../../../../Muxis-macOS-Universal.zip *.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muxis-macOS-Universal
          path: Muxis-macOS-Universal.zip
          retention-days: 14

  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Generate Linux Scaffolding
        run: flutter create --platforms=linux --org app.muxis .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Bundle
        run: flutter build linux --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Package Linux Bundle
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../Muxis-Linux-x64.tar.gz .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muxis-Linux-x64
          path: Muxis-Linux-x64.tar.gz
          retention-days: 14

  build-android:
    name: Build Android APK & App Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Scaffolding
        run: flutter create --platforms=android --org app.muxis .

      - name: Inject Android Brand Icons & Audio Service
        run: |
          cp -rf assets/brand/icons/android/mipmap-* android/app/src/main/res/
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          python3 scripts/configure_android_audio.py

      - name: Upgrade Android Gradle Plugin for WebView AAR
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i 's/8\.1\.0/8.1.4/g' android/settings.gradle
          fi
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/8\.1\.0/8.1.4/g' android/settings.gradle.kts
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ] && ! grep -q "REQUEST_INSTALL_PACKAGES" android/app/src/main/AndroidManifest.xml; then
            sed -i 's|<application|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          fi
          flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Build Android App Bundle (AAB)
        run: |
          sed -i '/REQUEST_INSTALL_PACKAGES/d' android/app/src/main/AndroidManifest.xml
          flutter build appbundle --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Muxis-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: Muxis-Android-Bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  build-ios:
    name: Build iOS (No Codesign Verification)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Generate iOS Scaffolding
        run: flutter create --platforms=ios --org app.muxis .

      - name: Inject iOS Brand Icons, Background Audio & Files Configuration
        run: python3 scripts/configure_ios_app.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App
        run: flutter build ios --release --no-codesign --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Package iOS App (.ipa + .zip)
        run: |
          cd build/ios/iphoneos
          rm -rf Payload && mkdir -p Payload
          cp -R Runner.app Payload/ || cp -R *.app Payload/
          zip -r -y ../../../Muxis-iOS.ipa Payload
          zip -r -y ../../../Muxis-iOS-Unsigned.zip Runner.app || zip -r -y ../../../Muxis-iOS-Unsigned.zip *.app

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muxis-iOS-Artifacts
          path: |
            Muxis-iOS.ipa
            Muxis-iOS-Unsigned.zip
          retention-days: 14
