name: Cross-Platform Matrix Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/build_all_platforms.yml'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 Desktop
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Generate Windows Scaffolding
        run: flutter create --platforms=windows --org app.muxis .

      - name: Configure VS Version for CMake
        shell: pwsh
        run: |
          echo "CMAKE_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Package Windows Release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Muxis-Windows-x64.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muxis-Windows-x64
          path: Muxis-Windows-x64.zip
          retention-days: 14

  build-macos:
    name: Build macOS Desktop
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Generate macOS Scaffolding
        run: flutter create --platforms=macos --org app.muxis .

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS App
        run: flutter build macos --release

      - name: Package macOS App
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../Muxis-macOS-Universal.zip muxis.app || zip -r -y ../../../../../Muxis-macOS-Universal.zip *.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muxis-macOS-Universal
          path: Muxis-macOS-Universal.zip
          retention-days: 14

  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Generate Linux Scaffolding
        run: flutter create --platforms=linux --org app.muxis .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Bundle
        run: flutter build linux --release

      - name: Package Linux Bundle
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../Muxis-Linux-x64.tar.gz .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muxis-Linux-x64
          path: Muxis-Linux-x64.tar.gz
          retention-days: 14

  build-android:
    name: Build Android APK & App Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Scaffolding
        run: flutter create --platforms=android --org app.muxis .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Muxis-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: Muxis-Android-Bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  build-ios:
    name: Build iOS (No Codesign Verification)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Generate iOS Scaffolding
        run: flutter create --platforms=ios --org app.muxis .

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Package iOS App
        run: |
          cd build/ios/iphoneos
          zip -r -y ../../../Muxis-iOS-Unsigned.zip Runner.app || zip -r -y ../../../Muxis-iOS-Unsigned.zip *.app

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muxis-iOS-Unsigned
          path: Muxis-iOS-Unsigned.zip
          retention-days: 14
