name: Production Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release-binaries:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-2022
            target: windows
          - name: macOS
            os: macos-latest
            target: macos
          - name: Linux
            os: ubuntu-latest
            target: linux
          - name: Android
            os: ubuntu-latest
            target: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (Android only)
        if: matrix.platform.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Linux dependencies
        if: matrix.platform.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Enable Desktop Platforms
        run: |
          flutter config --enable-windows-desktop
          flutter config --enable-macos-desktop
          flutter config --enable-linux-desktop

      - name: Generate Platform Scaffolding
        run: flutter create --platforms=${{ matrix.platform.target }} --org app.muxis .

      - name: Inject MUXIS Prismatic Aura Icon
        if: matrix.platform.target == 'windows'
        shell: pwsh
        run: |
          Copy-Item assets/brand/app_icon.ico windows/runner/resources/app_icon.ico -Force

      - name: Install dependencies
        run: flutter pub get

      # Build Windows
      - name: Build Windows
        if: matrix.platform.target == 'windows'
        shell: pwsh
        run: |
          echo "CMAKE_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV
          flutter build windows --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Muxis-Windows-x64-${{ github.ref_name }}.zip -Force
          Copy-Item Muxis-Windows-x64-${{ github.ref_name }}.zip Muxis-Windows-x64.zip -Force

      # Build macOS
      - name: Build macOS
        if: matrix.platform.target == 'macos'
        run: |
          flutter build macos --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../Muxis-macOS-Universal-${{ github.ref_name }}.zip muxis.app || zip -r -y ../../../../../Muxis-macOS-Universal-${{ github.ref_name }}.zip *.app
          cd ../../../../..
          cp Muxis-macOS-Universal-${{ github.ref_name }}.zip Muxis-macOS-Universal.zip

      # Build Linux
      - name: Build Linux
        if: matrix.platform.target == 'linux'
        run: |
          flutter build linux --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../Muxis-Linux-x64-${{ github.ref_name }}.tar.gz .
          cd ../../../../..
          cp Muxis-Linux-x64-${{ github.ref_name }}.tar.gz Muxis-Linux-x64.tar.gz

      # Build Android
      - name: Build Android
        if: matrix.platform.target == 'android'
        run: |
          flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          flutter build appbundle --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          cp build/app/outputs/flutter-apk/app-release.apk ./Muxis-Android-${{ github.ref_name }}.apk
          cp build/app/outputs/bundle/release/app-release.aab ./Muxis-Android-${{ github.ref_name }}.aab
          cp ./Muxis-Android-${{ github.ref_name }}.apk ./Muxis-Android.apk
          cp ./Muxis-Android-${{ github.ref_name }}.aab ./Muxis-Android.aab

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform.target }}
          path: |
            Muxis-*-${{ github.ref_name }}.*
            Muxis-Windows-x64.zip
            Muxis-macOS-Universal.zip
            Muxis-Linux-x64.tar.gz
            Muxis-Android.apk
            Muxis-Android.aab
          retention-days: 2

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          sha256sum Muxis-* > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MUXIS ${{ github.ref_name }} — Prismatic Aura
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Muxis-*
            checksums-sha256.txt
