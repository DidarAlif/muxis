name: Production Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release-binaries:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-2022
            target: windows
          - name: macOS
            os: macos-latest
            target: macos
          - name: Linux
            os: ubuntu-latest
            target: linux
          - name: Android
            os: ubuntu-latest
            target: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (Android only)
        if: matrix.platform.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Linux dependencies
        if: matrix.platform.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Enable Desktop Platforms
        run: |
          flutter config --enable-windows-desktop
          flutter config --enable-macos-desktop
          flutter config --enable-linux-desktop

      - name: Generate Platform Scaffolding
        run: flutter create --platforms=${{ matrix.platform.target }} --org app.muxis .

      - name: Inject MUXIS Brand Icons
        if: matrix.platform.target == 'windows'
        shell: pwsh
        run: |
          Copy-Item assets/brand/app_icon.ico windows/runner/resources/app_icon.ico -Force

      - name: Inject macOS Brand Icons
        if: matrix.platform.target == 'macos'
        run: |
          cp -f assets/brand/icons/macos/*.png macos/Runner/Assets.xcassets/AppIcon.appiconset/

      - name: Inject Android Brand Icons
        if: matrix.platform.target == 'android'
        run: |
          cp -rf assets/brand/icons/android/mipmap-* android/app/src/main/res/
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="muxis"/android:label="MUXIS"/g' android/app/src/main/AndroidManifest.xml
          fi

      - name: Upgrade Android Gradle Plugin for WebView AAR
        if: matrix.platform.target == 'android'
        run: |
          if [ -f android/settings.gradle ]; then
            sed -i 's/8\.1\.0/8.1.4/g' android/settings.gradle
          fi
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/8\.1\.0/8.1.4/g' android/settings.gradle.kts
          fi

      - name: Install dependencies
        run: flutter pub get

      # Build Windows
      - name: Build Windows
        if: matrix.platform.target == 'windows'
        shell: pwsh
        run: |
          echo "CMAKE_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV
          flutter build windows --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Muxis-Windows-x64-${{ github.ref_name }}.zip -Force
          Copy-Item Muxis-Windows-x64-${{ github.ref_name }}.zip Muxis-Windows-x64.zip -Force

          # Build Standard Windows Installer (.exe) via Inno Setup
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "1.1.7" }
          & $iscc "/DMyAppVersion=$ver" "/DOutputBaseName=Muxis-Windows-x64-Setup-${{ github.ref_name }}" "installer\windows\muxis_setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Copy-Item "Muxis-Windows-x64-Setup-${{ github.ref_name }}.exe" "Muxis-Windows-x64-Setup.exe" -Force

      # Build macOS
      - name: Build macOS
        if: matrix.platform.target == 'macos'
        run: |
          flutter build macos --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../Muxis-macOS-Universal-${{ github.ref_name }}.zip muxis.app || zip -r -y ../../../../../Muxis-macOS-Universal-${{ github.ref_name }}.zip *.app
          cd ../../../../..
          cp Muxis-macOS-Universal-${{ github.ref_name }}.zip Muxis-macOS-Universal.zip

      # Build Linux
      - name: Build Linux
        if: matrix.platform.target == 'linux'
        run: |
          flutter build linux --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../Muxis-Linux-x64-${{ github.ref_name }}.tar.gz .
          cd ../../../../..
          cp Muxis-Linux-x64-${{ github.ref_name }}.tar.gz Muxis-Linux-x64.tar.gz

      # Build Android
      - name: Build Android
        if: matrix.platform.target == 'android'
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ] && ! grep -q "REQUEST_INSTALL_PACKAGES" android/app/src/main/AndroidManifest.xml; then
            sed -i 's|<application|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          fi
          flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          sed -i '/REQUEST_INSTALL_PACKAGES/d' android/app/src/main/AndroidManifest.xml
          flutter build appbundle --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          cp build/app/outputs/flutter-apk/app-release.apk ./Muxis-Android-${{ github.ref_name }}.apk
          cp build/app/outputs/bundle/release/app-release.aab ./Muxis-Android-${{ github.ref_name }}.aab
          cp ./Muxis-Android-${{ github.ref_name }}.apk ./Muxis-Android.apk
          cp ./Muxis-Android-${{ github.ref_name }}.aab ./Muxis-Android.aab

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform.target }}
          path: |
            Muxis-*-${{ github.ref_name }}.*
            Muxis-Windows-x64.zip
            Muxis-Windows-x64-Setup.exe
            Muxis-macOS-Universal.zip
            Muxis-Linux-x64.tar.gz
            Muxis-Android.apk
            Muxis-Android.aab
          retention-days: 2

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          sha256sum Muxis-* > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MUXIS ${{ github.ref_name }} — Prismatic Aura
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Muxis-*
            checksums-sha256.txt
