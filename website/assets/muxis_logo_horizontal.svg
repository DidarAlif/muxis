<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="80%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#E100FF"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Monogram (scaled to 120x120 at offset 20,20) -->
  <g transform="translate(20, 20) scale(0.234)" filter="url(#subtleGlow)">
    <rect x="76" y="112" width="52" height="288" rx="26" fill="url(#brandGrad)"/>
    <path d="M 160 190 C 160 176, 178 168, 189 177 L 242 222 C 250 229, 262 229, 270 222 L 323 177 C 334 168, 352 176, 352 190 L 352 240 C 352 248, 347 256, 340 262 L 272 318 C 263 325, 249 325, 240 318 L 172 262 C 165 256, 160 248, 160 240 Z" fill="url(#brandGrad)"/>
    <rect x="384" y="112" width="52" height="288" rx="26" fill="url(#brandGrad)"/>
    <rect x="232" y="348" width="48" height="52" rx="24" fill="url(#brandGrad)"/>
    <circle cx="256" cy="156" r="14" fill="#00F2FE"/>
  </g>

  <!-- Brand Wordmark: MUXIS -->
  <g transform="translate(170, 98)">
    <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="9" 
          fill="url(#textGrad)">MUXIS</text>
  </g>

  <!-- Futuristic Prismatic Aura Subtitle / Micro-tag -->
  <g transform="translate(174, 126)">
    <text font-family="'JetBrains Mono', monospace" 
          font-size="12" 
          font-weight="600" 
          letter-spacing="6" 
          fill="#00F2FE" 
          opacity="0.9">PRISMATIC AURA</text>
  </g>

  <!-- Accent dot -->
  <circle cx="560" cy="92" r="5" fill="#E100FF"/>
</svg>
