<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep obsidian titanium squircle base -->
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121824"/>
      <stop offset="45%" stop-color="#090D14"/>
      <stop offset="100%" stop-color="#040609"/>
    </linearGradient>

    <!-- Electric Neon Green rim border gradient -->
    <linearGradient id="neonBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#10FFA0" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#00E676" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#05DF72" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Vibrant Brand Neon Green Monogram Gradient -->
    <linearGradient id="brandNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="40%" stop-color="#10FFA0"/>
      <stop offset="80%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#05DF72"/>
    </linearGradient>

    <!-- Apple-inspired liquid glass specular reflection -->
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient audio neon green light pool -->
    <radialGradient id="auraRadial" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#00E676" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#040609" stop-opacity="0"/>
    </radialGradient>

    <!-- Heavy icon drop shadow -->
    <filter id="iconDropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <!-- Core neon bloom glow -->
    <filter id="monogramBloom" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- iOS / macOS / Windows Squircle Base -->
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#iconBgGrad)" stroke="url(#neonBorderGrad)" stroke-width="3.5" filter="url(#iconDropShadow)"/>

  <!-- Liquid glass specular sheen overlay -->
  <rect x="30" y="30" width="452" height="226" rx="110" fill="url(#glassReflection)"/>

  <!-- Ambient audio light pool -->
  <circle cx="256" cy="256" r="185" fill="url(#auraRadial)"/>

  <!-- EXACT MATCH KINETIC MUXIS MONOGRAM (Scaled and centered) -->
  <g transform="translate(64, 64) scale(0.75)" filter="url(#monogramBloom)">
    <!-- Left outer harmonic beam -->
    <path d="M 88 128
             C 88 106, 118 106, 118 128
             L 118 384
             C 118 406, 88 406, 88 384
             Z"
          fill="url(#brandNeonGrad)"/>

    <!-- Right outer harmonic beam -->
    <path d="M 394 128
             C 394 106, 424 106, 424 128
             L 424 384
             C 424 406, 394 406, 394 384
             Z"
          fill="url(#brandNeonGrad)"/>

    <!-- Continuous central acoustic crest ('M') -->
    <path d="M 148 190
             C 148 168, 172 156, 190 170
             L 244 214
             C 251 220, 261 220, 268 214
             L 322 170
             C 340 156, 364 168, 364 190
             L 364 260
             C 364 274, 356 288, 344 296
             L 270 348
             C 261 354, 251 354, 242 348
             L 168 296
             C 156 288, 148 274, 148 260
             Z"
          fill="url(#brandNeonGrad)"/>

    <!-- Dynamic Central Core Frequency Node -->
    <circle cx="256" cy="154" r="14" fill="#00FF88"/>
    <circle cx="256" cy="154" r="6" fill="#FFFFFF"/>

    <!-- Sub-Bass Pulse Anchor Bar -->
    <rect x="236" y="376" width="40" height="12" rx="6" fill="#00FF88"/>
  </g>
</svg>
