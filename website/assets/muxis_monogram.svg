<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="muxisCyanViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="40%" stop-color="#4FACFE"/>
      <stop offset="75%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#E100FF"/>
    </linearGradient>
    <linearGradient id="barGlow1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="barGlow2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4FACFE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7F00FF" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="barGlow3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7F00FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E100FF" stop-opacity="1"/>
    </linearGradient>
    <filter id="prismaticGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background subtle aura -->
  <circle cx="256" cy="256" r="220" fill="url(#muxisCyanViolet)" opacity="0.08" filter="url(#prismaticGlow)"/>

  <!-- Geometric Muxis Monogram: Soundwave Prismatic M -->
  <g filter="url(#prismaticGlow)">
    <!-- Left outer vertical pillar -->
    <rect x="76" y="112" width="52" height="288" rx="26" fill="url(#barGlow1)"/>

    <!-- Left inner diagonal harmonic bar -->
    <path d="M 160 190 
             C 160 176, 178 168, 189 177 
             L 242 222 
             C 250 229, 262 229, 270 222 
             L 323 177 
             C 334 168, 352 176, 352 190 
             L 352 240 
             C 352 248, 347 256, 340 262 
             L 272 318 
             C 263 325, 249 325, 240 318 
             L 172 262 
             C 165 256, 160 248, 160 240 
             Z" 
          fill="url(#barGlow2)"/>

    <!-- Right outer vertical pillar -->
    <rect x="384" y="112" width="52" height="288" rx="26" fill="url(#barGlow3)"/>

    <!-- Dynamic Central Frequency Pulse -->
    <rect x="232" y="348" width="48" height="52" rx="24" fill="url(#muxisCyanViolet)"/>
    
    <!-- Central Prismatic Core Spark -->
    <circle cx="256" cy="156" r="14" fill="#00F2FE"/>
    <circle cx="256" cy="156" r="6" fill="#FFFFFF"/>
  </g>
</svg>
