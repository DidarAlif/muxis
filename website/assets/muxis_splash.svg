<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="splashAura" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#7F00FF" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#00F2FE" stop-opacity="0.10"/>
      <stop offset="80%" stop-color="#090B10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="splashMGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="35%" stop-color="#4FACFE"/>
      <stop offset="70%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#E100FF"/>
    </linearGradient>
    <filter id="splashGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="800" height="600" fill="#090B10"/>

  <!-- Radial Prismatic Aura -->
  <rect width="800" height="600" fill="url(#splashAura)"/>

  <!-- Center Monogram -->
  <g transform="translate(290, 140) scale(0.43)" filter="url(#splashGlow)">
    <rect x="76" y="112" width="52" height="288" rx="26" fill="url(#splashMGrad)"/>
    <path d="M 160 190 C 160 176, 178 168, 189 177 L 242 222 C 250 229, 262 229, 270 222 L 323 177 C 334 168, 352 176, 352 190 L 352 240 C 352 248, 347 256, 340 262 L 272 318 C 263 325, 249 325, 240 318 L 172 262 C 165 256, 160 248, 160 240 Z" fill="url(#splashMGrad)"/>
    <rect x="384" y="112" width="52" height="288" rx="26" fill="url(#splashMGrad)"/>
    <rect x="232" y="348" width="48" height="52" rx="24" fill="url(#splashMGrad)"/>
    <circle cx="256" cy="156" r="14" fill="#00F2FE"/>
    <circle cx="256" cy="156" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <text x="400" y="400" 
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="14" 
        fill="#FFFFFF">MUXIS</text>

  <!-- Tagline -->
  <text x="400" y="434" 
        text-anchor="middle"
        font-family="'JetBrains Mono', monospace" 
        font-size="12" 
        font-weight="600" 
        letter-spacing="6" 
        fill="#00F2FE">PRISMATIC AURA AUDIO</text>

  <!-- Loading Bar Indicator -->
  <rect x="330" y="470" width="140" height="3" rx="1.5" fill="#191F2D"/>
  <rect x="330" y="470" width="60" height="3" rx="1.5" fill="url(#splashMGrad)"/>
</svg>
