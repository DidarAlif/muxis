<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="splashBg" cx="50%" cy="48%" r="70%">
      <stop offset="0%" stop-color="#0E1C28"/>
      <stop offset="55%" stop-color="#060910"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>
    <linearGradient id="splashPrism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="48%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#9D6BFF"/>
    </linearGradient>
    <filter id="splashGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#splashBg)"/>
  <g transform="translate(256, 175) scale(1.0)" filter="url(#splashGlow)">

    <!-- Outer harmonic water-wave resonance arcs -->
    <path d="M 74 218 C 52 240, 52 278, 74 302" fill="none" stroke="url(#splashPrism)" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
    <path d="M 438 218 C 460 240, 460 278, 438 302" fill="none" stroke="url(#splashPrism)" stroke-width="14" stroke-linecap="round" opacity="0.55"/>

    <!-- Continuous Liquid-Wave 'M' Acoustic Crest Ribbon -->
    <path d="M 106 362
             L 106 184
             C 106 142, 152 126, 184 156
             L 242 214
             C 250 222, 262 222, 270 214
             L 328 156
             C 360 126, 406 142, 406 184
             L 406 362
             C 406 382, 370 382, 370 362
             L 370 198
             C 370 180, 352 174, 340 186
             L 278 248
             C 265 261, 247 261, 234 248
             L 172 186
             C 160 174, 142 180, 142 198
             L 142 362
             C 142 382, 106 382, 106 362
             Z"
          fill="url(#splashPrism)"/>

    <!-- Sculpted Inner Wave Bridge (turns negative space into an unmistakable sonic wave + M crest) -->
    <path d="M 178 292
             Q 216 266, 256 300
             Q 296 334, 334 292"
          fill="none" stroke="url(#splashPrism)" stroke-width="22" stroke-linecap="round" opacity="0.95"/>

    <!-- Floating Liquid Prism Droplet Orb above the 'M' crest -->
    <path d="M 256 102
             C 272 122, 280 136, 280 148
             C 280 162, 269 173, 256 173
             C 243 173, 232 162, 232 148
             C 232 136, 240 122, 256 102
             Z"
          fill="url(#splashPrism)"/>
    <circle cx="250" cy="146" r="6" fill="#FFFFFF" opacity="0.92"/>

  </g>
  <text x="512" y="730" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-size="60" font-weight="900" letter-spacing="14" fill="#FFFFFF" text-anchor="middle">MUXIS</text>
  <text x="512" y="776" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" letter-spacing="6" fill="#00E5FF" text-anchor="middle">LIQUID AURORA AUDIO</text>
</svg>
