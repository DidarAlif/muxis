<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUXIS Cloud Verification — by A Leaf ORG</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/muxis_app_icon.png">
  <script defer src="js/main.js"></script>
</head>
<body>
  <div class="ambient-canvas" aria-hidden="true">
    <div class="aurora-orb orb-mint"></div>
    <div class="aurora-orb orb-teal"></div>
    <div class="aurora-orb orb-violet"></div>
    <div class="aurora-orb orb-coral"></div>
  </div>
  <div class="global-pointer-caustic" aria-hidden="true"></div>

  <main style="min-height: 100vh; display: grid; place-items: center; padding: 32px 20px;">
    <div id="status-card" class="hero-spotlight liquid-surface" style="max-width: 580px; width: 100%; text-align: center; padding: 38px 30px;" data-tilt>
      <div style="display: flex; justify-content: center; gap: 14px; align-items: center; margin-bottom: 18px;">
        <img src="assets/muxis_app_icon.png" alt="MUXIS" style="width: 54px; height: 54px; border-radius: 14px; background: #fff; padding: 3px;">
        <img src="assets/a_leaf_org_logo.svg" alt="A Leaf ORG" style="height: 22px; width: auto;">
      </div>
      <span id="status-badge" class="chip-tag" style="margin-bottom: 14px;">MUXIS CLOUD AUTH</span>
      <h1 id="status-title" style="font-size: 30px; margin-bottom: 12px;">Email Verified</h1>
      <p id="status-message" class="hero-lead" style="margin: 0 auto 24px;">
        Your email address has been verified for MUXIS Cloud. Return to the MUXIS app and sign in with your Google or email account.
      </p>
      <div class="hero-actions" style="justify-content: center;">
        <a id="open-app-btn" href="muxis://auth-callback" class="btn btn-primary liquid-surface">Open MUXIS App</a>
        <a href="index.html" class="btn btn-glass liquid-surface">Explore Website</a>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var q = new URLSearchParams(window.location.search);
      var h = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
      var errCode = q.get('error_code') || h.get('error_code') || q.get('error') || h.get('error');
      var errDesc = q.get('error_description') || h.get('error_description');
      var badge = document.getElementById('status-badge');
      var title = document.getElementById('status-title');
      var msg = document.getElementById('status-message');
      var card = document.getElementById('status-card');
      var openBtn = document.getElementById('open-app-btn');
      if (window.location.search || window.location.hash) {
        openBtn.href = 'muxis://auth-callback' + window.location.search + window.location.hash;
      }
      if (errCode) {
        card.style.borderColor = 'rgba(239, 68, 68, 0.45)';
        badge.textContent = 'LINK EXPIRED OR USED';
        badge.style.color = '#fca5a5';
        title.textContent = 'Confirmation Link Expired';
        msg.textContent = errCode === 'otp_expired'
          ? 'This confirmation link has expired or was already used. Open MUXIS and request a fresh link.'
          : (errDesc || 'Verification could not complete. Open MUXIS and try again.');
      } else {
        badge.textContent = 'VERIFIED READY TO SYNC';
        title.textContent = 'Email Confirmed!';
        msg.textContent = 'Your MUXIS Cloud account is verified. Return to MUXIS and sign in to sync across devices.';
      }
    })();
  </script>
</body>
</html>
