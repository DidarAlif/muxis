name: muxis
description: "Muxis: A cross-platform music streaming and local player with Prismatic Aura design."
publish_to: "none"
version: 1.1.1+11

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Icons & Graphics
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6

  # State Management & DI
  flutter_riverpod: ^2.4.9

  # Routing
  go_router: ^13.0.0

  # Audio Playback
  just_audio: ^0.9.36
  just_audio_windows: ^0.2.2
  audio_service: ^0.18.12
  audio_session: ^0.1.18

  # Networking & APIs
  dio: ^5.4.0
  http: ^1.2.0
  supabase_flutter: ^2.3.4
  flutter_dotenv: ^5.1.0

  # Storage & Persistence
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3

  # Utilities & Desktop UX
  intl: ^0.19.0
  uuid: ^4.3.3
  crypto: ^3.0.3
  window_manager: ^0.3.7
  file_picker: ^8.1.2
  desktop_drop: ^0.4.4
  url_launcher: ^6.3.0
  desktop_webview_window: ^0.3.2
  webview_flutter: ">=4.10.0 <4.14.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/brand/variants/
    - assets/placeholders/
